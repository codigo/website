name: Test, Build, Push Docker Image, Trigger Deployment

on:
  push:
    branches: ['main']

jobs:
  test:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
      env:
        PUBLIC_LOG_LEVEL: info
        PUBLIC_APP_ENV: development
        NODE_ENV: development
        PUBLIC_CF_TURNSTILE_KEY: ${{ secrets.PUBLIC_CF_TURNSTILE_KEY }}
        SECRET_CF_TURNSTILE_SECRET: ${{ secrets.SECRET_CF_TURNSTILE_SECRET }}
        PUBLIC_POCKETBASE_URL: ${{ secrets.PUBLIC_POCKETBASE_URL }}
        SECRET_OPENAI_API_KEY: ${{ secrets.SECRET_OPENAI_API_KEY }}
        SECRET_POCKETBASE_ADMIN_PASSWORD: ${{ secrets.SECRET_POCKETBASE_ADMIN_PASSWORD }}
        SECRET_POCKETBASE_ADMIN_EMAIL: ${{ secrets.SECRET_POCKETBASE_ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install
      - name: Run your tests
        run: npx playwright test
        env:
          HOME: /root

  semantic-release:
    needs: test
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    name: 'Semantic Release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          persist-credentials: true
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.1.2
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/changelog
            @semantic-release/npm
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}

  build:
    name: 'Build and Push Docker Image'
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set version from semantic release output
        run: |
          echo "TAG=${{ needs.semantic-release.outputs.new_release_version }}" >> $GITHUB_ENV
          echo "NAME=$(jq -r '.name' package.json)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build Container
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY_URL }}/codigo/${{ env.NAME }}:${{ env.TAG }}
            ${{ vars.CONTAINER_REGISTRY_URL }}/codigo/${{ env.NAME }}:latest
          build-args: |
            PUBLIC_CF_TURNSTILE_KEY=${{ secrets.PUBLIC_CF_TURNSTILE_KEY }}
            SECRET_CF_TURNSTILE_SECRET=${{ secrets.SECRET_CF_TURNSTILE_SECRET }}
            PUBLIC_POCKETBASE_URL=${{ secrets.PUBLIC_POCKETBASE_URL }}
            SECRET_OPENAI_API_KEY=${{ secrets.SECRET_OPENAI_API_KEY }}

  deploy:
    name: 'Deploy to VPS via Docker Context'
    runs-on: ubuntu-latest
    needs: [semantic-release, build]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Deploy via Docker Context
        env:
          # Production environment variables for docker-compose.yml
          CONTAINER_REGISTRY_URL: ${{ vars.CONTAINER_REGISTRY_URL }}
          IMAGE_TAG: ${{ needs.semantic-release.outputs.new_release_version }}
          NETWORK_DRIVER: overlay
          CADDY_NET_EXTERNAL: true
          REPLICAS: 1
          DEBUG: false
          PUBLIC_LOG_LEVEL: info
          PB_DATA_PATH: /home/codigo/mau-app/data/pocketbase/pb_data
          PB_MIGRATIONS_PATH: /home/codigo/mau-app/pb/pb_migrations
          PUBLIC_POCKETBASE_URL: http://pocketbase:8090
          SECRET_POCKETBASE_ADMIN_EMAIL: ${{ secrets.SECRET_POCKETBASE_ADMIN_EMAIL }}
          SECRET_POCKETBASE_ADMIN_PASSWORD: ${{ secrets.SECRET_POCKETBASE_ADMIN_PASSWORD }}
        run: |
          # Set up SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

          # Ensure PocketBase directories exist on VPS (data volume + migrations)
          # chown to uid=100(pocketbase) so the container can write to the data directory
          ssh -i ~/.ssh/id_rsa codigo@${{ secrets.VPS_IP }} "mkdir -p /home/codigo/mau-app/data/pocketbase/pb_data /home/codigo/mau-app/pb/pb_migrations && sudo chown -R 100:101 /home/codigo/mau-app/data/pocketbase/pb_data"

          # Copy PocketBase migrations to VPS
          scp -i ~/.ssh/id_rsa -r pb/pb_migrations/* codigo@${{ secrets.VPS_IP }}:/home/codigo/mau-app/pb/pb_migrations/

          # Create Docker context and deploy
          docker context create vps --docker "host=ssh://codigo@${{ secrets.VPS_IP }}"
          docker --context vps stack deploy \
            --compose-file docker-compose.yml \
            --with-registry-auth \
            mau-app

      # Note: Embeddings are generated automatically via PocketBase subscription
      # Manual generation if needed: docker exec <container_name> npm run embeddings:generate
